configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:80/admin"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    
    configs:
      - source: ts-serve
        target: /config/serve.json
    
    volumes:
      - ./ts/config:/config
      - ./ts/state:/var/lib/tailscale
    
    devices:
      - /dev/net/tun:/dev/net/tun
    
    cap_add:
      - net_admin
    
    ports:
      - "0.0.0.0:53:53/udp"                  # DNS - local network
      - "0.0.0.0:53:53/tcp"                  # DNS - local network
      - "0.0.0.0:${SERVICEPORT}:80/tcp"       # Admin UI - local network (remapped to avoid conflict with NPM)
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - default
      - homelab

    restart: unless-stopped

  # Pi-hole
  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    
    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - DNSMASQ_LISTENING=all    # Listen on all interfaces (required with Tailscale sidecar)
    
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    
    cap_add:
      - NET_ADMIN  # Required for Pi-hole DNS/DHCP to function
    
    depends_on:
      tailscale:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    
    restart: unless-stopped

networks:
  default:
    name: pihole_internal
  homelab:
    external: true
