services:
  # Pi-hole
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}
    
    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - DNSMASQ_LISTENING=all
    
    volumes:
      - ${HOME_LAB_DIR:-.}/etc-pihole:/etc/pihole
      - ${HOME_LAB_DIR:-.}/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "0.0.0.0:53:53/udp"
      - "0.0.0.0:53:53/tcp"
      - "0.0.0.0:${SERVICEPORT}:80/tcp"
    
    cap_add:
      - NET_ADMIN  # Required for Pi-hole DNS/DHCP to function
    
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default
      - homelab
    restart: unless-stopped

networks:
  default:
    name: pihole_internal
  homelab:
    external: true
