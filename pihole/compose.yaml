services:
  # Pi-hole
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}

    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - DNSMASQ_LISTENING=all    # Listen on all interfaces

    volumes:
      - ${HOME_LAB_DIR:-.}/etc-pihole:/etc/pihole
      - ${HOME_LAB_DIR:-.}/etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_ADMIN  # Required for Pi-hole DNS/DHCP to function

    ports:
      - "0.0.0.0:53:53/udp"                  # DNS - local network
      - "0.0.0.0:53:53/tcp"                  # DNS - local network
      - "0.0.0.0:${SERVICEPORT}:80/tcp"      # Admin UI - local network

    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      default: {}
      homelab: {}

    restart: unless-stopped

networks:
  default:
    name: pihole_internal
  homelab:
    external: true
