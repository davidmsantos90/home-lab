services:
  # Pi-hole
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}

    environment:
      - TZ=${TZ}
      # - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
      - DNSMASQ_LISTENING=all    # Listen on all interfaces
      # Required so this instance (SECONDARY) accepts config pushed by Nebula
      # Sync from the Proxmox PRIMARY — see "Pi-hole PRIMARY/SECONDARY sync
      # (Nebula Sync)" in README.md.
      - FTLCONF_webserver_api_app_sudo=true

    volumes:
      - ${HOME_LAB_DIR:-.}/etc-pihole:/etc/pihole
      - ${HOME_LAB_DIR:-.}/etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_ADMIN  # Required for Pi-hole DNS/DHCP to function

    ports:
      - "0.0.0.0:53:53/udp"                  # DNS - local network
      - "0.0.0.0:53:53/tcp"                  # DNS - local network
      - "0.0.0.0:${SERVICEPORT}:80/tcp"      # Admin UI - local network

    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      default: {}
      homelab: {}

    restart: unless-stopped

  # Nebula Sync — keeps this instance (SECONDARY) in sync with the
  # Proxmox-hosted Pi-hole (PRIMARY). See README.md for the selective-sync
  # policy and setup steps.
  nebula-sync:
    container_name: nebula-sync-${SERVICE}
    image: ghcr.io/lovelaze/nebula-sync:latest

    environment:
      - TZ=${TZ}
      # PRIMARY = source of truth (Proxmox). REPLICAS = this instance, reached
      # by container name over the shared `homelab` network.
      - PRIMARY=${NEBULA_SYNC_PRIMARY_URL}|${NEBULA_SYNC_PRIMARY_PASSWORD}
      - REPLICAS=http://app-${SERVICE}|${NEBULA_SYNC_SECONDARY_PASSWORD}
      - FULL_SYNC=false
      - RUN_GRAVITY=true
      - CRON=${NEBULA_SYNC_CRON:-0 5 * * *}
      # Selective sync policy: DNS/Resolver config + Gravity lists/groups/
      # clients. DHCP/NTP/Database/Misc/Debug are intentionally excluded — DHCP
      # stays on the router, the rest are instance-local concerns.
      - SYNC_CONFIG_DNS=true
      - SYNC_CONFIG_RESOLVER=true
      - SYNC_GRAVITY_GROUP=true
      - SYNC_GRAVITY_AD_LIST=true
      - SYNC_GRAVITY_AD_LIST_BY_GROUP=true
      - SYNC_GRAVITY_DOMAIN_LIST=true
      - SYNC_GRAVITY_DOMAIN_LIST_BY_GROUP=true
      - SYNC_GRAVITY_CLIENT=true
      - SYNC_GRAVITY_CLIENT_BY_GROUP=true

    networks:
      homelab: {}

    restart: unless-stopped

networks:
  default:
    name: pihole_internal
  homelab:
    external: true
