services:
  # Dante SOCKS5 Proxy
  application:
    build: .
    container_name: app-${SERVICE}

    volumes:
      - ${HOME_LAB_DIR:-.}/dante.conf:/etc/danted.conf:ro
      - ./entrypoint.sh:/entrypoint.sh:ro

    ports:
      - "0.0.0.0:${SERVICEPORT}:1080"

    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 1080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      default: {}
      homelab: {}

    restart: unless-stopped

networks:
  default:
    name: dante_internal
  homelab:
    external: true
