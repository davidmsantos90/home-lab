services:
  # Plex
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}
    # Cap CPU usage so library scans/analysis/transcoding can't starve other
    # services (e.g. NPM) on this host's limited core count.
    cpus: ${PLEX_CPU_LIMIT:-2.0}

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}

    volumes:
      - ${HOME_LAB_DIR:-.}/config:/config
      - ${PLEX_MEDIA_PATH:-${HOME_LAB_DIR:-.}/media}:/media   # Mount your full media root here

    ports:
      - "0.0.0.0:${SERVICEPORT}:32400/tcp"  # Plex web UI - local network

    healthcheck:
      test: ["CMD", "pgrep", "-f", "Plex Media Server"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s  # Plex takes time to start, especially after a migration

    networks:
      default: {}
      homelab: {}

    restart: unless-stopped

networks:
  default:
    name: plex_internal
  homelab:
    external: true
