configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:32400"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ${HOME_LAB_DIR:-.}/ts/config:/config
      - ${HOME_LAB_DIR:-.}/ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    dns:
      - ${DNS_SERVER}
      - ${DNS_SERVER_FALLBACK}
    ports:
      - "0.0.0.0:${SERVICEPORT}:${SERVICEPORT}"  # Plex web UI - local network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - homelab
    restart: unless-stopped

  # Plex
  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${PLEX_CONFIG_PATH:-${HOME_LAB_DIR:-.}/plex-data/config}:/config
      - ${PLEX_MEDIA_PATH:-./plex-data/media}:/media   # Mount your full media root here
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "Plex Media Server"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s  # Plex takes time to start, especially after a migration
    restart: unless-stopped

networks:
  default:
    name: plex_internal
  homelab:
    external: true
