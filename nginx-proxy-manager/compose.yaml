# To enable a pretty Tailnet URL (https://nginx-proxy-manager.<tailnet>.ts.net), you would
# uncomment the configs block below and add TS_SERVE_CONFIG + configs mount to the tailscale
# service. However, Tailscale Serve claims port 443, which conflicts with NPM's own HTTPS
# listener on the same network namespace — NPM would fail to bind. The trade-off is:
#   - With TS_SERVE_CONFIG: pretty Tailnet URL ✅, but NPM loses LAN port 443 ❌
#   - Without (current):    NPM owns port 443 on LAN ✅, Tailnet access via raw Tailscale IP ✅
# If you only need Tailscale Serve on port 80 (no LAN HTTPS), you could re-enable it pointing
# at http://127.0.0.1:80 instead of 443, and NPM would keep LAN HTTPS.
#
# configs:
#   ts-serve:
#     content: |
#       {"TCP":{"443":{"HTTPS":true}},
#       "Web":{"$${TS_CERT_DOMAIN}:443":
#           {"Handlers":{"/":
#           {"Proxy":"http://127.0.0.1:81"}}}},
#       "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  # NPM app (via network_mode) handles ports 80, 443, and 81 on its macvlan IP.
  # TS_SERVE_CONFIG is intentionally omitted — see comment above.
  # Access NPM on the Tailnet via the Tailscale IP directly (run: tailscale ip -4).
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # - TS_SERVE_CONFIG=/config/serve.json  # See comment at top of file
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    
    # Uncomment alongside TS_SERVE_CONFIG above
    # configs:
    #   - source: ts-serve
    #     target: /config/serve.json

    volumes:
      - ${HOME_LAB_DIR:-.}/ts/config:/config
      - ${HOME_LAB_DIR:-.}/ts/state:/var/lib/tailscale
    
    devices:
      - /dev/net/tun:/dev/net/tun
    
    cap_add:
      - net_admin
    
    # No ports: block needed — macvlan gives this container a real LAN IP (${NPM_IP})

    # Resolve local DNS names (e.g. Pi-hole "Local DNS Records") when setting
    # a proxy host's Forward Hostname/IP, instead of relying on ambient
    # Docker daemon DNS (which may or may not point at Pi-hole depending on
    # host config) or hardcoded Docker container names.
    #
    # Fallback (1.1.1.1) only kicks in if Pi-hole is unreachable/times out —
    # not on a legitimate "not found" answer — so external/Let's Encrypt DNS
    # resolution keeps working during a Pi-hole outage. Local Pi-hole DNS
    # records still can't resolve during that outage, since Pi-hole is their
    # only source of truth.
    #
    # dns_search must be disabled: setting an explicit dns: list also makes
    # Docker copy the host's search domain (e.g. "lan") into this container's
    # resolv.conf, which breaks bare Docker container-name resolution (e.g.
    # "tailscale-immich" gets queried as "tailscale-immich.lan" and NXDOMAINs
    # against Docker's embedded DNS). dns_search: [] is silently ignored by
    # Docker (the host's search domain still gets inherited) — dns_search:
    # ["."] is required to actually disable search-domain expansion and
    # restore literal name resolution for container names, while keeping the
    # dns: servers above for everything else.
    dns:
      - ${PIHOLE_LAN_IP}
      - ${DNS_FALLBACK}
    dns_search: ["."]

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      default: {}
      homelab:
        ipv4_address: 192.168.100.5    # Static homelab IP for wg-easy to reach via NETMAP
      macvlan:                       # No ports: needed — macvlan gives this container a real LAN IP
        ipv4_address: ${NPM_IP}      # Static LAN IP — reserve this in your router
    
    restart: unless-stopped

  # Nginx Proxy Manager
  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    
    environment:
      - TZ=${TZ}
    
    volumes:
      - ${HOME_LAB_DIR:-.}/data:/data
      - ${HOME_LAB_DIR:-.}/letsencrypt:/etc/letsencrypt
    
    depends_on:
      tailscale:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # NPM needs time to initialise its DB on first run
    
    restart: unless-stopped

networks:
  default:
    name: npm_internal
  homelab:
    external: true
  macvlan:
    external: true
