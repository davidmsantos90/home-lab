services:
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}
    environment:
      - TZ=${TZ}
    volumes:
      - ${HOME_LAB_DIR:-.}/data:/data
      - ${HOME_LAB_DIR:-.}/letsencrypt:/etc/letsencrypt
    dns:
      - ${PIHOLE_LAN_IP}
      - ${DNS_FALLBACK}
    dns_search: ["."]
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      default: {}
      homelab:
        ipv4_address: 192.168.100.5
      macvlan:
        ipv4_address: ${NPM_IP}
        mac_address: ${NPM_MAC}
    restart: unless-stopped

networks:
  default:
    name: npm_internal
  homelab:
    external: true
  macvlan:
    external: true
