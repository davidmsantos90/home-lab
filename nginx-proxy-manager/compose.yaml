services:
  # Nginx Proxy Manager
  application:
    image: ${IMAGE_URL}
    container_name: ${SERVICE}

    environment:
      - TZ=${TZ}

    volumes:
      - ${HOME_LAB_DIR:-.}/data:/data
      - ${HOME_LAB_DIR:-.}/letsencrypt:/etc/letsencrypt

    # Resolve local DNS names (e.g. Pi-hole "Local DNS Records") when setting
    # a proxy host's Forward Hostname/IP, instead of relying on ambient
    # Docker daemon DNS (which may or may not point at Pi-hole depending on
    # host config) or hardcoded Docker container names.
    #
    # Fallback (1.1.1.1) only kicks in if Pi-hole is unreachable/times out —
    # not on a legitimate "not found" answer — so external/Let's Encrypt DNS
    # resolution keeps working during a Pi-hole outage. Local Pi-hole DNS
    # records still can't resolve during that outage, since Pi-hole is their
    # only source of truth.
    #
    # dns_search must be disabled: setting an explicit dns: list also makes
    # Docker copy the host's search domain (e.g. "lan") into this container's
    # resolv.conf, which breaks bare Docker container-name resolution (e.g.
    # "tailscale-immich" gets queried as "tailscale-immich.lan" and NXDOMAINs
    # against Docker's embedded DNS). dns_search: [] is silently ignored by
    # Docker (the host's search domain still gets inherited) — dns_search:
    # ["."] is required to actually disable search-domain expansion and
    # restore literal name resolution for container names, while keeping the
    # dns: servers above for everything else.
    dns:
      - ${PIHOLE_LAN_IP}
      - ${DNS_FALLBACK}
    dns_search: ["."]

    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # NPM needs time to initialise its DB on first run

    networks:
      default: {}
      homelab:
        ipv4_address: 192.168.100.5    # Static homelab IP for wg-easy to reach via NETMAP.
                                        # Previously held by the (now removed) Tailscale
                                        # sidecar via network_mode: service:tailscale — moved
                                        # here so it stays the same and wg-easy's NAT exception
                                        # rule (10.200.0.5 -> 192.168.100.5) keeps working.
      macvlan:                       # No ports: needed — macvlan gives this container a real LAN IP
        ipv4_address: ${NPM_IP}      # Static LAN IP — reserve this in your router
        mac_address: ${NPM_MAC}      # Pinned so the router's ARP/IP-MAC binding doesn't
                                      # break on every container recreation (Docker assigns
                                      # a new random MAC each time otherwise, same IP)

    restart: unless-stopped

networks:
  default:
    name: npm_internal
  homelab:
    external: true
  macvlan:
    external: true
