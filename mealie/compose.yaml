services:
  # Mealie
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      BASE_URL: ${BASE_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      DB_ENGINE: sqlite
      OIDC_AUTH_ENABLED: ${OIDC_AUTH_ENABLED}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME}
      OIDC_CONFIGURATION_URL: ${OIDC_CONFIGURATION_URL}
      OIDC_USER_CLAIM: ${OIDC_USER_CLAIM}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SIGNUP_ENABLED: ${OIDC_SIGNUP_ENABLED}
      OIDC_USER_GROUP: ${OIDC_USER_GROUP}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP}
      OIDC_AUTO_REDIRECT: ${OIDC_AUTO_REDIRECT}
      OIDC_REMEMBER_ME: ${OIDC_REMEMBER_ME}
      OIDC_REQUIRES_EMAIL_VERIFICATION: ${OIDC_REQUIRES_EMAIL_VERIFICATION:-true}

    volumes:
      - ${MEALIE_DATA_PATH:-${HOME_LAB_DIR:-.}/mealie-data}:/app/data

    ports:
      - "0.0.0.0:${SERVICEPORT}:9000/tcp"

    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT}

    networks:
      default: {}
      homelab: {}

    restart: unless-stopped

networks:
  default:
    name: mealie_internal
  homelab:
    external: true
