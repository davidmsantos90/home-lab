services:
  # Deluge
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - DELUGE_LOGLEVEL=error
      # Persisted (bind-mounted) location for pip packages needed by plugins
      # (e.g. YaRSS2) whose bundled/vendored deps are incompatible with this
      # image's Python version. Installing into /config survives container
      # recreation/image updates, unlike the image's own site-packages.
      - PYTHONPATH=/config/python-libs

    volumes:
      - ${HOME_LAB_DIR:-.}/config:/config
      - ${DOWNLOADS_PATH:-${HOME_LAB_DIR:-.}/downloads}:/downloads

    ports:
      - "0.0.0.0:${SERVICEPORT}:${SERVICEPORT}"  # Web UI - local network
      - "0.0.0.0:${DAEMON_PORT}:${DAEMON_PORT}"  # Daemon RPC - native client connections
      - "0.0.0.0:6881:6881/tcp"                   # Torrent traffic
      - "0.0.0.0:6881:6881/udp"                   # Torrent traffic

    healthcheck:
      test: ["CMD", "pgrep", "-f", "deluged"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      default: {}
      homelab: {}

    restart: always

networks:
  default:
    name: deluge_internal
  homelab:
    external: true
