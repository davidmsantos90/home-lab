configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8096"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ${HOME_LAB_DIR:-.}/ts/config:/config
      - ${HOME_LAB_DIR:-.}/ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    dns:
      - ${DNS_SERVER}
      - ${DNS_SERVER_FALLBACK}
    dns_search: ["."]  # "." disables search-domain expansion; an empty list is silently ignored by Docker and would still inherit the host's search domain, breaking Docker container-name resolution
    ports:
      - "0.0.0.0:${SERVICEPORT}:${SERVICEPORT}"  # Jellyfin web UI - local network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - homelab
    restart: unless-stopped

  # Jellyfin
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}
    network_mode: service:tailscale
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${JELLYFIN_CONFIG_PATH:-${HOME_LAB_DIR:-.}/jellyfin-data/config}:/config
      - ${JELLYFIN_CACHE_PATH:-${HOME_LAB_DIR:-.}/jellyfin-data/cache}:/cache
      - ${JELLYFIN_MEDIA_PATH:-./jellyfin-data/media}:/media   # Mount your full media root here
    # Hardware transcoding — uncomment the relevant block for your hardware:
    #
    # Intel Quick Sync (iGPU):
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA GPU (also set NVIDIA_VISIBLE_DEVICES=all in environment):
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8096/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  default:
    name: jellyfin_internal
  homelab:
    external: true
