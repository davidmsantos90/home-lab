services:
  # Jellyfin
  application:
    image: ${IMAGE_URL}
    container_name: app-${SERVICE}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${JELLYFIN_CONFIG_PATH:-${HOME_LAB_DIR:-.}/jellyfin-data/config}:/config
      - ${JELLYFIN_CACHE_PATH:-${HOME_LAB_DIR:-.}/jellyfin-data/cache}:/cache
      - ${JELLYFIN_MEDIA_PATH:-./jellyfin-data/media}:/media   # Mount your full media root here
    # Hardware transcoding — uncomment the relevant block for your hardware:
    #
    # Intel Quick Sync (iGPU):
    # devices:
    #   - /dev/dri:/dev/dri
    #
    # NVIDIA GPU (also set NVIDIA_VISIBLE_DEVICES=all in environment):
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "0.0.0.0:${SERVICEPORT}:8096/tcp"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8096/health"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      default: {}
      homelab: {}
    restart: unless-stopped

networks:
  default:
    name: jellyfin_internal
  homelab:
    external: true
