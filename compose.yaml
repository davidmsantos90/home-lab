services:
  init:
    image: busybox
    command: echo "homelab and macvlan networks ready"
    networks:
      - homelab
      - macvlan

networks:
  homelab:
    name: homelab
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1

  macvlan:
    name: macvlan
    driver: macvlan
    driver_opts:
      parent: eth0
    ipam:
      config:
        - subnet: 192.168.1.0/24
          ip_range: 192.168.1.4/30
