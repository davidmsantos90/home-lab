services:
  init:
    image: busybox
    command: echo "homelab network ready"
    networks:
      - homelab

networks:
  homelab:
    name: homelab
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1   # Stable gateway — use this in NPM for host services
