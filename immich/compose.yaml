services:
  # Immich server
  application:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: app-${SERVICE}-server
    
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    
    env_file:
      - .env
    ports:
      - "0.0.0.0:${SERVICEPORT}:${SERVICEPORT}"
    
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    
    healthcheck:
      disable: false
    networks:
      - default
      - homelab
    restart: unless-stopped

  # immich-machine-learning:
  #   container_name: app-${SERVICE}-machine-learning
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
  #   volumes:
  #     - ./data/model-cache:/cache
  #   env_file:
  #     - .env
  #   healthcheck:
  #     disable: false
  #   restart: unless-stopped

  redis:
    container_name: app-${SERVICE}-redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9

    healthcheck:
      test: redis-cli ping || exit 1
    
    restart: unless-stopped

  database:
    container_name: app-${SERVICE}-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    
    volumes:
      - ${DB_DATA_LOCATION:-${HOME_LAB_DIR:-.}/postgres-data}:/var/lib/postgresql/data
    
    restart: unless-stopped

networks:
  default:
    name: immich_internal
  homelab:
    external: true
