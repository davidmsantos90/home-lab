configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:2283"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    
    configs:
      - source: ts-serve
        target: /config/serve.json
    
    volumes:
      - ${HOME_LAB_DIR:-.}/ts/config:/config
      - ${HOME_LAB_DIR:-.}/ts/state:/var/lib/tailscale
    
    devices:
      - /dev/net/tun:/dev/net/tun
    
    cap_add:
      - net_admin
    
    dns:
      - ${DNS_SERVER}
      - ${DNS_SERVER_FALLBACK}
    dns_search: []  # Prevent host search-domain suffix breaking Docker container-name resolution
    
    ports:
      - "0.0.0.0:${SERVICEPORT}:${SERVICEPORT}"  # Web UI - local network
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - default
      - homelab
    
    restart: unless-stopped

  # Immich server
  application:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    network_mode: service:tailscale
    container_name: app-${SERVICE}-server
    
    volumes:
      - ${UPLOAD_LOCATION}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    
    env_file:
      - .env
    
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
      tailscale:
        condition: service_healthy
    
    healthcheck:
      disable: false
    
    restart: unless-stopped

  # immich-machine-learning:
  #   container_name: app-${SERVICE}-machine-learning
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
  #   volumes:
  #     - ./data/model-cache:/cache
  #   env_file:
  #     - .env
  #   healthcheck:
  #     disable: false
  #   restart: unless-stopped

  redis:
    container_name: app-${SERVICE}-redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9

    healthcheck:
      test: redis-cli ping || exit 1
    
    restart: unless-stopped

  database:
    container_name: app-${SERVICE}-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    
    volumes:
      - ${DB_DATA_LOCATION:-${HOME_LAB_DIR:-.}/postgres-data}:/var/lib/postgresql/data
    
    restart: unless-stopped

networks:
  default:
    name: immich_internal
  homelab:
    external: true
