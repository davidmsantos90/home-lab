services:
  app-shell:
    build:
      context: .
    container_name: app-shell
    environment:
      APP_SHELL_CONFIG_PATH: /app/app-shell.config.json
      APP_SHELL_PORT: ${APP_SHELL_PORT:-3000}
    volumes:
      - ${HOME_LAB_DIR:-.}/app-shell.config.json:/app/app-shell.config.json:ro
    ports:
      - "127.0.0.1:${APP_SHELL_PORT:-3000}:3000"
    restart: unless-stopped
