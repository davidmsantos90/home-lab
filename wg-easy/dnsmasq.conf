# dnsmasq DNS proxy for WireGuard VPN clients
# Listens on all interfaces on port 5353 for DNAT redirected queries.
#
# RFC-007: all DNS queries arriving from wg0 are forwarded here, then dnsmasq
# either answers local homelab hostnames with translated addresses or forwards
# upstream to Pi-hole for every other query. No payload inspection is required.

# Listen on all interfaces (iptables DNAT will redirect wg0 port 53 here)
port=5353

# Forward everything else upstream to Pi-hole.
server=10.200.0.60

# Rewrite pimlicoa.duckdns.org (and all subdomains — nginx, plex, deluge,
# little-pi4, immich, portainer, pi-hole, and any future homelab hosts) to
# the translated form of the Pi's own real LAN IP.
#
# This is still required even after removing the macvlan network: NETMAP
# (in bootstrap-hooks.sh) only rewrites a packet's destination if it's
# already addressed to something inside WG_TRANSLATED_LAN_SUBNET
# (10.200.0.0/24). If a VPN client's *own* local network also happens to be
# 192.168.1.0/24 (the overlapping-client case RFC-001 exists for), its OS
# routing table will always prefer the physically-connected local interface
# over the VPN tunnel's AllowedIPs for that same subnet — so an unmodified
# DNS answer of the real address (e.g. 192.168.1.60) would silently route
# out the client's own LAN instead of through the tunnel, never reaching
# the home network at all. Rewriting the answer to the translated address
# (10.200.0.60) avoids that collision: it's outside the client's own LAN,
# so it's guaranteed to route through the tunnel, where NETMAP then maps it
# back to the real address (192.168.1.60) 1:1 by last octet.
#
# Update the IP below if the Pi's real LAN IP (PIHOLE_LAN_IP in
# nginx-proxy-manager/.env, also the value in Pi-hole's Local DNS Record
# for this domain) is ever changed from the 192.168.1.60 default.
#
# Caveat: this also matches the bare/apex domain (pimlicoa.duckdns.org),
# which is also WG_EASY_HOST — the hostname WireGuard clients resolve to
# find the VPN server's public endpoint. This is safe in practice because
# that resolution happens before the tunnel is up, using the client's normal
# system DNS, not this VPN-pushed DNS — the rewrite only affects queries
# made while already connected through the tunnel.
address=/pimlicoa.duckdns.org/10.200.0.60

# If a specific service is later moved to a different machine/IP, add a
# more specific override below — dnsmasq always matches the most specific
# domain rule first, regardless of file order, so this takes precedence
# over the wildcard for that one subdomain only:
# address=/some-service.pimlicoa.duckdns.org/10.200.0.X

# Keep original answers for direct queries (optional, for logging)
log-queries
log-facility=/var/log/dnsmasq.log

# Cache settings
cache-size=150
