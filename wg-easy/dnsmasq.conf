# dnsmasq DNS proxy for WireGuard VPN clients
# Listens on all interfaces on port 5353 for DNAT redirected queries

# Listen on all interfaces (iptables DNAT will redirect wg0 port 53 here)
port=5353

# Forward all other queries to Pi-hole
server=10.200.0.60

# Rewrite nginx.pimlicoa.duckdns.org (and all subdomains) to translated address for VPN clients
address=/nginx.pimlicoa.duckdns.org/10.200.0.5

# Host-native services (e.g. Plex, Deluge, little-pi4) are reached via an NPM
# proxy host, which forwards internally to the host (or another LAN device)
# over the "homelab" bridge network — that hop never crosses the WireGuard
# tunnel, so it only needs the same NPM translated address as any other
# NPM-proxied domain.
address=/plex.pimlicoa.duckdns.org/10.200.0.5
address=/deluge.pimlicoa.duckdns.org/10.200.0.5
address=/little-pi4.pimlicoa.duckdns.org/10.200.0.5

# All other NPM proxy hosts (containerized services reverse-proxied through
# NPM) must also be rewritten here, one line per domain, or VPN clients will
# get Pi-hole's real/untranslated NPM answer (192.168.1.5) instead of the
# translated address (10.200.0.5) and fail to connect.
address=/immich.pimlicoa.duckdns.org/10.200.0.5
address=/portainer.pimlicoa.duckdns.org/10.200.0.5
address=/pi-hole.pimlicoa.duckdns.org/10.200.0.5

# Keep original answers for direct queries (optional, for logging)
log-queries
log-facility=/var/log/dnsmasq.log

# Cache settings
cache-size=150
