services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns-wg-easy
    environment:
      TZ: ${TZ}
      SUBDOMAINS: pimlicoa
      TOKEN: ${DUCKDNS_TOKEN}
      LOG_FILE: "false"
    restart: unless-stopped

  dnsmasq:
    image: alpine:latest
    container_name: dnsmasq-wg-easy
    entrypoint: sh -c 'apk add --no-cache dnsmasq && dnsmasq -k'
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    networks:
      wg_easy_internal:
        ipv4_address: 172.28.0.2    # Static IP: wg-easy's PostUp/PostDown rules embed this
                                     # IP as a literal value in wg-easy's persisted config, so
                                     # if it ever drifted (unpinned = dynamic Docker IPAM), the
                                     # saved rules would silently go stale on any restart where
                                     # dnsmasq happened to get reassigned — the same class of bug
                                     # already fixed for the homelab bridge (NPM/wg-easy collision).
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_EASY_ADMIN_USERNAME}
      INIT_PASSWORD: ${WG_EASY_ADMIN_PASSWORD}
      INIT_HOST: ${WG_EASY_HOST:-pimlicoa.duckdns.org}
      INIT_PORT: "51820"
      INIT_DNS: ${WG_VPN_DNS}
      # Native wg-easy default (applies only on the container's very first
      # ever boot — see wg-easy docs on unattended setup). This covers fresh
      # installs cleanly from the start; bootstrap-hooks.sh's userconfig API
      # call remains necessary for already-initialized installs (like this
      # one) and for PostUp/PostDown/keepalive, which have no INIT_* env var.
      INIT_ALLOWED_IPS: ${WG_VPN_ALLOWED_IPS}
      # RFC-001: Overlap subnet translation
      HOME_LAN_SUBNET: ${HOME_LAN_SUBNET}
      WG_TRANSLATED_LAN_SUBNET: ${WG_TRANSLATED_LAN_SUBNET}
    volumes:
      - ${HOME_LAB_DIR:-.}/data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:51821"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      wg_easy_internal: {}
      homelab:
        ipv4_address: 192.168.100.9    # Static homelab IP so it never collides with
                                        # other services' pinned/dynamic IPs (e.g. NPM's .5)
    restart: unless-stopped

  wg-easy-hooks-bootstrap:
    image: curlimages/curl:8.9.1
    container_name: wg-easy-hooks-bootstrap
    depends_on:
      wg-easy:
        condition: service_healthy
    environment:
      WG_EASY_API_URL: http://wg-easy:51821
      WG_EASY_ADMIN_USERNAME: ${WG_EASY_ADMIN_USERNAME}
      WG_EASY_ADMIN_PASSWORD: ${WG_EASY_ADMIN_PASSWORD}
      # Used by dnsmasq for local domain rewrites.
      WG_EASY_HOST: ${WG_EASY_HOST:-pimlicoa.duckdns.org}
      HOME_LAN_SUBNET: ${HOME_LAN_SUBNET}
      WG_TRANSLATED_LAN_SUBNET: ${WG_TRANSLATED_LAN_SUBNET}
      WG_VPN_DNS: ${WG_VPN_DNS}
      WG_VPN_ALLOWED_IPS: ${WG_VPN_ALLOWED_IPS}
      WG_VPN_PERSISTENT_KEEPALIVE: ${WG_VPN_PERSISTENT_KEEPALIVE:-25}
      # Must match dnsmasq's pinned ipv4_address on wg_easy_internal below.
      DNSMASQ_IP: ${DNSMASQ_IP:-172.28.0.2}
    volumes:
      - ./bootstrap-hooks.sh:/bootstrap-hooks.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-hooks.sh"]
    networks:
      - wg_easy_internal
    restart: "no"

networks:
  wg_easy_internal:
    name: wg_easy_bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24    # Explicit subnet required to pin dnsmasq's ipv4_address below
  homelab:
    external: true
