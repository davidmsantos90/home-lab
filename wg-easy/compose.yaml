configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://wg-easy:51821"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns-wg-easy
    environment:
      TZ: ${TZ}
      SUBDOMAINS: pimlicoa
      TOKEN: ${DUCKDNS_TOKEN}
      LOG_FILE: "false"
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-wg-easy
    hostname: wg-easy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
      TS_AUTH_ONCE: "true"
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ${HOME_LAB_DIR:-.}/ts/config:/config
      - ${HOME_LAB_DIR:-.}/ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - wg_easy_internal
      - homelab
    restart: unless-stopped

  dnsmasq:
    image: alpine:latest
    container_name: dnsmasq-wg-easy
    entrypoint: sh -c 'apk add --no-cache dnsmasq && dnsmasq -k'
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    networks:
      - wg_easy_internal
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_EASY_ADMIN_USERNAME}
      INIT_PASSWORD: ${WG_EASY_ADMIN_PASSWORD}
      INIT_HOST: ${WG_EASY_HOST:-pimlicoa.duckdns.org}
      INIT_PORT: "51820"
      INIT_DNS: ${WG_VPN_DNS}
      # RFC-001: Overlap subnet translation
      HOME_LAN_SUBNET: ${HOME_LAN_SUBNET}
      WG_TRANSLATED_LAN_SUBNET: ${WG_TRANSLATED_LAN_SUBNET}
    volumes:
      - ${HOME_LAB_DIR:-.}/data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:51821"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wg_easy_internal
      - homelab
    restart: unless-stopped

  wg-easy-hooks-bootstrap:
    image: curlimages/curl:8.9.1
    container_name: wg-easy-hooks-bootstrap
    depends_on:
      wg-easy:
        condition: service_healthy
    environment:
      WG_EASY_API_URL: http://wg-easy:51821
      WG_EASY_ADMIN_USERNAME: ${WG_EASY_ADMIN_USERNAME}
      WG_EASY_ADMIN_PASSWORD: ${WG_EASY_ADMIN_PASSWORD}
      HOME_LAN_SUBNET: ${HOME_LAN_SUBNET}
      WG_TRANSLATED_LAN_SUBNET: ${WG_TRANSLATED_LAN_SUBNET}
      WG_VPN_DNS: ${WG_VPN_DNS}
      WG_VPN_ALLOWED_IPS: ${WG_VPN_ALLOWED_IPS}
      WG_VPN_PERSISTENT_KEEPALIVE: ${WG_VPN_PERSISTENT_KEEPALIVE:-25}
    volumes:
      - ./bootstrap-hooks.sh:/bootstrap-hooks.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-hooks.sh"]
    networks:
      - wg_easy_internal
    restart: "no"

networks:
  wg_easy_internal:
    name: wg_easy_bridge
  homelab:
    external: true
