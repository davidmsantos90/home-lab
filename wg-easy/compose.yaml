configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://wg-easy:51821"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns-wg-easy
    environment:
      TZ: ${TZ}
      SUBDOMAINS: pimlicoa
      TOKEN: ${DUCKDNS_TOKEN}
      LOG_FILE: "false"
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-wg-easy
    hostname: wg-easy
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
      TS_AUTH_ONCE: "true"
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./ts/config:/config
      - ./ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - wg_easy_internal
      - homelab
    restart: unless-stopped

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    environment:
      INSECURE: "true"
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_EASY_ADMIN_USERNAME}
      INIT_PASSWORD: ${WG_EASY_ADMIN_PASSWORD}
      INIT_HOST: ${WG_EASY_HOST:-pimlicoa.duckdns.org}
      INIT_PORT: "51820"
      INIT_ALLOWED_IPS: ${WG_ALLOWED_IPS:-10.200.0.0/24}
    volumes:
      - ./data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:51821"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - wg_easy_internal
      - homelab
    restart: unless-stopped

  wg-overlap-fix:
    image: alpine:3.22
    container_name: wg-overlap-fix
    network_mode: service:wg-easy
    environment:
      HOME_LAN_SUBNET: ${HOME_LAN_SUBNET:-192.168.1.0/24}
      WG_TRANSLATED_LAN_SUBNET: ${WG_TRANSLATED_LAN_SUBNET:-10.200.0.0/24}
    cap_add:
      - NET_ADMIN
    depends_on:
      wg-easy:
        condition: service_healthy
    command: >
      /bin/sh -ceu '
      apk add --no-cache iptables >/dev/null;
      until ip link show wg0 >/dev/null 2>&1; do sleep 2; done;
      iptables -t nat -C PREROUTING -i wg0 -d "$WG_TRANSLATED_LAN_SUBNET" -j NETMAP --to "$HOME_LAN_SUBNET" || iptables -t nat -A PREROUTING -i wg0 -d "$WG_TRANSLATED_LAN_SUBNET" -j NETMAP --to "$HOME_LAN_SUBNET";
      iptables -t nat -C POSTROUTING -o wg0 -s "$HOME_LAN_SUBNET" -j NETMAP --to "$WG_TRANSLATED_LAN_SUBNET" || iptables -t nat -A POSTROUTING -o wg0 -s "$HOME_LAN_SUBNET" -j NETMAP --to "$WG_TRANSLATED_LAN_SUBNET";
      iptables -C FORWARD -i wg0 -d "$HOME_LAN_SUBNET" -j ACCEPT || iptables -A FORWARD -i wg0 -d "$HOME_LAN_SUBNET" -j ACCEPT;
      iptables -C FORWARD -o wg0 -s "$HOME_LAN_SUBNET" -j ACCEPT || iptables -A FORWARD -o wg0 -s "$HOME_LAN_SUBNET" -j ACCEPT;
      tail -f /dev/null
      '
    restart: unless-stopped

networks:
  wg_easy_internal:
    name: wg_easy_bridge
  homelab:
    external: true
