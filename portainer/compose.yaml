configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:9000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    
    configs:
      - source: ts-serve
        target: /config/serve.json
    
    volumes:
      - ${HOME_LAB_DIR:-.}/ts/config:/config
      - ${HOME_LAB_DIR:-.}/ts/state:/var/lib/tailscale
    
    devices:
      - /dev/net/tun:/dev/net/tun
    
    cap_add:
      - net_admin
    
    ports:
      - "0.0.0.0:${SERVICEPORT}:${SERVICEPORT}"  # Web UI - local network
    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - default
      - homelab
    
    restart: unless-stopped

  # Portainer
  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    
    environment:
      - TZ=${TZ}
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME_LAB_DIR:-.}/data:/data
    
    depends_on:
      tailscale:
        condition: service_healthy
    
    restart: unless-stopped

networks:
  default:
    name: portainer_internal
  homelab:
    external: true
